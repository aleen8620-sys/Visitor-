<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>لوحة الاستقبال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
:root{
  --bg:#eef3f7; --panel:#fff; --panel-2:#f6fafc;
  --line:#d8e5ee; --line-soft:#e9f1f6;
  --ink:#0a2c47; --ink-2:#3d6483; --ink-3:#7191aa;
  --brand:#0d5a92; --brand-2:#1a76b8; --brand-ink:#fff; --brand-soft:#e4f0fa;
  --good:#146b4f; --good-soft:#dcf1e7; --good-rule:#a3d6c2;
  --warn:#8a5510; --warn-soft:#fbeedb; --warn-rule:#e8cb9c;
  --danger:#96331f; --danger-soft:#fbe4dd; --danger-rule:#e9b4a4;
  --vip:#8a6410; --vip-soft:#f8eed6;
  --c1:#0d5a92; --c2:#9a6a0a; --c3:#8c3f86; --c4:#b04a34;
  --r:13px;
  --sans:"IBM Plex Sans Arabic",ui-sans-serif,system-ui,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#061119; --panel:#0e2135; --panel-2:#132b43;
  --line:#1f3d59; --line-soft:#1a3450;
  --ink:#e9f3fa; --ink-2:#a7c5dc; --ink-3:#7597b3;
  --brand:#4fa9dd; --brand-2:#7cc6ef; --brand-ink:#04223a; --brand-soft:#12344f;
  --good:#4dbc92; --good-soft:#0f2e24; --good-rule:#1e5643;
  --warn:#dfa254; --warn-soft:#2f2010; --warn-rule:#5e4420;
  --danger:#e0876f; --danger-soft:#33170f; --danger-rule:#6a3122;
  --vip:#d3aa4a; --vip-soft:#2f2610;
  --c1:#3f93cc; --c2:#c08a1a; --c3:#a25aa8; --c4:#c4574a;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
.top{padding-block:22px 14px;border-bottom:1px solid var(--line);margin-bottom:16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700;margin:0}
.top .g{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
.tab:hover{border-color:var(--brand)}
.tab[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(10,44,71,.06),0 10px 26px -14px rgba(10,44,71,.28)}
.hd{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.hd h2{margin:0;font-size:16px;font-weight:600}
.hd .s{font-size:12.5px;color:var(--ink-3);width:100%;margin-top:-4px}
.bd{padding:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.grid>*{min-width:0}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.inp{width:100%;font-family:inherit;font-size:14.5px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:9px;
  border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);background:none}
.btn.sm{font-size:12.5px;padding:6px 12px}
.btn.w{width:100%}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:13px;display:grid;gap:1px}
.tile .n{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .k{font-size:12px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.n{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.g{background:var(--good-soft);color:var(--good)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.b{background:var(--brand-soft);color:var(--brand)}
.chip.v{background:var(--vip-soft);color:var(--vip)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
th{text-align:start;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:10px 13px;background:var(--panel-2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;
  border:1px solid var(--line);background:var(--panel-2)}
.note.g{background:var(--good-soft);border-color:var(--good-rule);color:var(--good)}
.note.w{background:var(--warn-soft);border-color:var(--warn-rule);color:var(--warn)}
.note.d{background:var(--danger-soft);border-color:var(--danger-rule);color:var(--danger)}
.empty{text-align:center;padding:36px 18px;color:var(--ink-3);font-size:13.5px}
.empty b{display:block;color:var(--ink-2);font-size:15px;font-weight:600;margin-bottom:5px}
.bigin{font-family:var(--mono);font-size:27px;text-align:center;letter-spacing:.2em;
  padding:16px;width:100%;border-radius:11px;border:1.5px solid var(--line);
  background:var(--panel-2);color:var(--ink)}
.out{display:grid;gap:7px;text-align:center;padding:20px 14px;border-radius:12px;margin-top:14px}
.out.ok{background:var(--good-soft);border:1px solid var(--good-rule)}
.out.dup{background:var(--warn-soft);border:1px solid var(--warn-rule)}
.out.no{background:var(--danger-soft);border:1px solid var(--danger-rule)}
.out .big{font-size:19px;font-weight:700}
.out .mid{font-size:13.5px;color:var(--ink-2)}
.badge{width:90mm;height:55mm;background:#fff;color:#0a2c47;border:1px solid #d8e5ee;
  border-radius:3mm;padding:5mm;display:grid;grid-template-columns:1fr auto;
  grid-template-rows:auto 1fr auto;gap:2mm;margin:0 auto;direction:rtl;overflow:hidden}
.badge .ev{grid-column:1/-1;font-size:8pt;color:#7191aa}
.badge .nm{font-size:15pt;font-weight:700;line-height:1.25;align-self:center}
.badge .co{font-size:8.5pt;color:#3d6483}
.badge .qr{grid-row:2/4;grid-column:2;align-self:center;width:21mm;height:21mm}
.badge .qr img,.badge .qr canvas{width:21mm!important;height:21mm!important}
.badge .cd{font-family:var(--mono);font-size:10pt;letter-spacing:.1em;align-self:end}
.bwrap{padding:16px;background:var(--panel-2);border-radius:11px;overflow-x:auto}
@media print{
  @page{size:90mm 55mm;margin:0}
  body *{visibility:hidden!important}
  .badge,.badge *{visibility:visible!important}
  .badge{position:absolute;inset:0;margin:0;border:none;border-radius:0;width:90mm;height:55mm}
}
.bar{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:7px}
.bar .lab{width:96px;flex:none;color:var(--ink-2)}
.bar .tr{flex:1;height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.bar .fi{height:100%;border-radius:99px}
.bar .vl{font-family:var(--mono);font-size:12px;width:66px;text-align:end;flex:none;color:var(--ink-2)}
.login{max-width:380px;margin:60px auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;
  border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top" id="top" hidden>
    <h1 id="evname">لوحة الاستقبال</h1>
    <div class="g">
      <span class="who" id="who"></span>
      <button class="btn ghost sm" id="logout">خروج</button>
    </div>
  </header>
  <div class="tabs" id="tabs" hidden>
    <button class="tab" data-tab="gate" aria-pressed="true">البوابة</button>
    <button class="tab" data-tab="list" aria-pressed="false">الزوار</button>
    <button class="tab" data-tab="quick" aria-pressed="false">تسجيل سريع</button>
    <button class="tab" data-tab="badge" aria-pressed="false">الباج</button>
    <button class="tab" data-tab="rep" aria-pressed="false">التقارير</button>
  </div>
  <main id="view"><div class="note" style="margin-top:40px"><span class="spin"></span> لحظة…</div></main>
</div>

<script>
/* ============================================================
   نفس القيم الموجودة في index.html
   ============================================================ */
var SUPABASE_URL = "https://vkdcmirfahdttfecouli.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZGNtaXJmYWhkdHRmZWNvdWxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzE0NjgsImV4cCI6MjEwNjg0NzQ2OH0.P6CZq7-jRjAxeZaJ1efcQsWVt1d9swp8M0KIXRlVFU8";
var EVENT_SLUG = "jeddah-2026";
/* ============================================================ */

(function(){
  "use strict";
  var sb=null, SESSION=null, VISITORS=[], EVNAME="";
  var S={tab:"gate", q:"", gate:null, badge:null, msg:"", loading:true};

  var CATS={visitor:["زائر","n","var(--c1)"],exhibitor:["عارض","w","var(--c2)"],
            media:["إعلامي","b","var(--c3)"],vip:["كبار الشخصيات","v","var(--c4)"]};
  function catName(c){ return (CATS[c]||CATS.visitor)[0]; }
  function catCls(c){ return (CATS[c]||CATS.visitor)[1]; }
  function catCol(c){ return (CATS[c]||CATS.visitor)[2]; }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]; }); }
  function $(s){ return document.querySelector(s); }
  function digits(v){ return String(v||"").replace(/\D/g,"").replace(/^(966|0)+/,""); }
  function fmt(d){ d=String(d||""); return d.length===9?"+966 "+d.slice(0,2)+" "+d.slice(2,5)+" "+d.slice(5):"+966 "+d; }
  function hhmm(t){ if(!t)return "—"; try{ return new Date(t).toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return "—"; } }
  function hourOf(t){ try{ return new Date(t).getHours(); }catch(e){ return -1; } }

  function qr(el,text,size){
    if(!el||typeof QRCode==="undefined")return;
    el.innerHTML="";
    try{ new QRCode(el,{text:String(text),width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ el.textContent=text; }
  }

  /* ---------- login ---------- */
  function viewLogin(){
    return '<div class="card login"><div class="hd"><h2>دخول الموظفين</h2></div><div class="bd">'+
      '<form id="lf" class="grid">'+
        '<div><label class="lbl" for="le">البريد الإلكتروني</label>'+
          '<input class="inp" id="le" type="email" dir="ltr" autocomplete="username" required></div>'+
        '<div><label class="lbl" for="lp">كلمة المرور</label>'+
          '<input class="inp" id="lp" type="password" autocomplete="current-password" required></div>'+
        (S.msg?'<div class="note d">'+esc(S.msg)+'</div>':'')+
        '<button class="btn w" type="submit" id="lb">دخول</button>'+
        '<button class="btn ghost w" type="button" id="su">إنشاء حساب جديد</button>'+
      '</form></div></div>';
  }

  /* ---------- gate ---------- */
  function viewGate(){
    var o="";
    if(S.gate){ var g=S.gate;
      o='<div class="out '+g.kind+'"><div class="big">'+esc(g.title)+'</div>'+
        (g.mid?'<div class="mid">'+esc(g.mid)+'</div>':'')+
        (g.chip?'<div><span class="chip '+g.cls+'">'+esc(g.chip)+'</span></div>':'')+'</div>';
    }
    return '<div class="card"><div class="hd"><h2>البوابة الإلكترونية</h2>'+
      '<div class="s">اكتب رمز الزائر المكوّن من ٨ أرقام</div></div><div class="bd">'+
      '<form id="gf" autocomplete="off">'+
        '<input class="bigin" id="gc" placeholder="00000000" maxlength="8" inputmode="numeric" dir="ltr" autofocus>'+
        '<button class="btn w" type="submit" style="margin-top:12px">تسجيل الدخول</button>'+
      '</form>'+o+'</div></div>';
  }

  /* ---------- list ---------- */
  function viewList(){
    var q=S.q.trim().toLowerCase(), qd=digits(S.q), qc=S.q.replace(/\D/g,"");
    var rows=VISITORS.filter(function(v){
      if(!q) return true;
      var hay=((v.name||"")+" "+(v.company||"")+" "+(v.email||"")+" "+(v.code||"")).toLowerCase();
      return hay.indexOf(q)>=0 || (qd.length>3 && String(v.phone||"").indexOf(qd)>=0)
          || (qc.length>2 && String(v.code||"").indexOf(qc)>=0);
    });
    var inC=VISITORS.filter(function(v){return v.checked_in_at;}).length;

    var tiles='<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="tile"><div class="n">'+VISITORS.length+'</div><div class="k">مسجّل</div></div>'+
      '<div class="tile"><div class="n">'+inC+'</div><div class="k">حضر فعلاً</div></div>'+
      '<div class="tile"><div class="n">'+(VISITORS.length-inC)+'</div><div class="k">لم يحضر</div></div>'+
      '<div class="tile"><div class="n">'+(VISITORS.length?Math.round(inC/VISITORS.length*100):0)+'%</div>'+
        '<div class="k">نسبة الحضور</div></div></div>';

    var body;
    if(!VISITORS.length){
      body='<div class="empty"><b>لا يوجد زوار بعد</b>شارك رابط التسجيل، أو سجّل زائراً من تبويب «تسجيل سريع».</div>';
    } else if(!rows.length){
      body='<div class="empty"><b>لا نتائج</b>جرّب بحثاً آخر.</div>';
    } else {
      body='<div class="scroll"><table><thead><tr>'+
        '<th>الاسم</th><th>الصفة</th><th>الجهة</th><th>الجوال</th><th>الرمز</th>'+
        '<th>الحالة</th><th>طريقة التسجيل</th><th>الوقت</th><th></th></tr></thead><tbody>'+
        rows.map(function(v){
          return '<tr><td><b>'+esc(v.name)+'</b>'+
            (v.job_title?'<div style="font-size:11.5px;color:var(--ink-3)">'+esc(v.job_title)+'</div>':'')+'</td>'+
            '<td><span class="chip '+catCls(v.category)+'">'+esc(catName(v.category))+'</span></td>'+
            '<td>'+esc(v.company||"—")+'</td>'+
            '<td><span class="mono">'+esc(fmt(v.phone))+'</span></td>'+
            '<td><span class="mono">'+esc(v.code)+'</span></td>'+
            '<td>'+(v.checked_in_at?'<span class="chip g">دخل</span>':'<span class="chip n">مسجّل</span>')+'</td>'+
            '<td>'+(v.source==="onsite"?"في الموقع":"أونلاين")+'</td>'+
            '<td class="mono">'+esc(hhmm(v.checked_in_at))+'</td>'+
            '<td><button class="btn ghost sm" data-badge="'+esc(v.code)+'">باج</button></td></tr>';
        }).join("")+'</tbody></table></div>';
    }
    return tiles+'<div class="card"><div class="hd"><h2>سجل الزوار</h2>'+
      '<button class="btn ghost sm" id="refresh" style="margin-inline-start:auto">تحديث</button>'+
      '<button class="btn ghost sm" id="csv">تصدير CSV</button></div>'+
      (VISITORS.length?'<div class="bd" style="padding:12px 18px;border-bottom:1px solid var(--line-soft)">'+
        '<input class="inp" id="sbx" placeholder="ابحث بالاسم أو الجوال أو الرمز أو الجهة" value="'+esc(S.q)+'"></div>':'')+
      body+'</div>';
  }

  /* ---------- quick ---------- */
  function viewQuick(){
    return '<div class="card"><div class="hd"><h2>تسجيل سريع في الموقع</h2>'+
      '<div class="s">للزوار غير المعتادين على التسجيل الإلكتروني — الاسم والجوال فقط</div></div><div class="bd">'+
      '<form id="qf" class="grid" autocomplete="off">'+
        '<div><label class="lbl" for="qn">الاسم الكامل</label><input class="inp" id="qn" maxlength="80"></div>'+
        '<div><label class="lbl" for="qp">رقم الجوال</label>'+
          '<input class="inp" id="qp" dir="ltr" inputmode="numeric" placeholder="5xxxxxxxx" maxlength="14"></div>'+
        '<div id="qmsg"></div>'+
        '<button class="btn w" type="submit">تسجيل وإصدار الرمز</button>'+
      '</form></div></div>';
  }

  /* ---------- badge ---------- */
  function viewBadge(){
    if(!VISITORS.length) return '<div class="card"><div class="bd"><div class="empty">'+
      '<b>لا يوجد زوار بعد</b>سجّل زائراً أولاً.</div></div></div>';
    var v=null;
    for(var i=0;i<VISITORS.length;i++) if(VISITORS[i].code===S.badge) v=VISITORS[i];
    if(!v) v=VISITORS[0];
    return '<div class="card"><div class="hd"><h2>الباج</h2>'+
      '<div class="s">مقاس ٩٠ × ٥٥ ملم</div></div><div class="bd">'+
      '<div class="bwrap"><div class="badge">'+
        '<div class="ev">'+esc(EVNAME||"المعرض")+'</div>'+
        '<div class="nm">'+esc(v.name)+'</div>'+
        '<div class="qr" id="bq"></div>'+
        '<div><div class="co">'+esc(v.company||"")+(v.job_title?" · "+esc(v.job_title):"")+'</div>'+
          '<div class="cd">'+esc(v.code)+'</div></div>'+
      '</div></div>'+
      '<button class="btn w" id="print" style="margin-top:14px">طباعة</button>'+
      '<div style="margin-top:12px"><label class="lbl">اختر زائراً</label>'+
      '<select class="inp" id="bpick">'+VISITORS.map(function(x){
        return '<option value="'+esc(x.code)+'"'+(x.code===v.code?" selected":"")+'>'+
          esc(x.name)+' — '+esc(x.code)+'</option>';}).join("")+'</select></div>'+
      '</div></div>';
  }

  /* ---------- reports ---------- */
  function viewRep(){
    if(!VISITORS.length) return '<div class="card"><div class="bd"><div class="empty">'+
      '<b>لا توجد بيانات بعد</b></div></div></div>';
    var inC=VISITORS.filter(function(v){return v.checked_in_at;}).length;
    var cats=Object.keys(CATS).map(function(k){
      var reg=VISITORS.filter(function(v){return (v.category||"visitor")===k;});
      return {k:k,lab:CATS[k][0],col:CATS[k][2],reg:reg.length,
              att:reg.filter(function(v){return v.checked_in_at;}).length};
    }).filter(function(x){return x.reg>0;});
    var mx=Math.max.apply(null,cats.map(function(x){return x.reg;}).concat([1]));
    var hours={},mh=1;
    VISITORS.forEach(function(v){ if(!v.checked_in_at)return; var h=hourOf(v.checked_in_at);
      if(h<0)return; hours[h]=(hours[h]||0)+1; if(hours[h]>mh)mh=hours[h]; });
    var hk=Object.keys(hours).sort(function(a,b){return a-b;});
    var onsite=VISITORS.filter(function(v){return v.source==="onsite";}).length;

    return '<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="tile"><div class="n">'+VISITORS.length+'</div><div class="k">إجمالي المسجّلين</div></div>'+
      '<div class="tile"><div class="n">'+inC+'</div><div class="k">الحضور الفعلي</div></div>'+
      '<div class="tile"><div class="n">'+onsite+'</div><div class="k">سجّلوا في الموقع</div></div>'+
      '<div class="tile"><div class="n">'+(VISITORS.length?Math.round(inC/VISITORS.length*100):0)+'%</div>'+
        '<div class="k">نسبة الحضور</div></div></div>'+
      '<div class="card"><div class="hd"><h2>التوزيع حسب الفئة</h2>'+
        '<div class="s">الشريط = المسجّلون · الرقم = حضر / مسجّل</div></div><div class="bd">'+
        cats.map(function(x){ return '<div class="bar"><span class="lab">'+esc(x.lab)+'</span>'+
          '<span class="tr"><span class="fi" style="width:'+Math.round(x.reg/mx*100)+'%;background:'+x.col+'"></span></span>'+
          '<span class="vl">'+x.att+' / '+x.reg+'</span></div>'; }).join("")+'</div>'+
        '<div class="scroll"><table><thead><tr><th>الفئة</th><th>مسجّل</th><th>حضر</th><th>النسبة</th></tr></thead><tbody>'+
        cats.map(function(x){ return '<tr><td><span class="chip '+catCls(x.k)+'">'+esc(x.lab)+'</span></td>'+
          '<td class="mono">'+x.reg+'</td><td class="mono">'+x.att+'</td>'+
          '<td class="mono">'+(x.reg?Math.round(x.att/x.reg*100):0)+'%</td></tr>'; }).join("")+
        '<tr style="font-weight:700"><td>الإجمالي</td><td class="mono">'+VISITORS.length+'</td>'+
        '<td class="mono">'+inC+'</td><td class="mono">'+(VISITORS.length?Math.round(inC/VISITORS.length*100):0)+'%</td></tr>'+
        '</tbody></table></div></div>'+
      '<div class="card"><div class="hd"><h2>ساعات الدخول</h2></div><div class="bd">'+
        (hk.length?hk.map(function(h){ return '<div class="bar"><span class="lab mono">'+
          String(h).padStart(2,"0")+':00</span>'+
          '<span class="tr"><span class="fi" style="width:'+Math.round(hours[h]/mh*100)+'%;background:var(--brand)"></span></span>'+
          '<span class="vl">'+hours[h]+'</span></div>'; }).join("")
          :'<div class="empty" style="padding:20px">لا دخول مسجّل بعد</div>')+
      '</div></div>';
  }

  var VIEWS={gate:viewGate,list:viewList,quick:viewQuick,badge:viewBadge,rep:viewRep};

  function render(){
    var showApp=!!SESSION;
    $("#top").hidden=!showApp; $("#tabs").hidden=!showApp;
    if(!showApp){ $("#view").innerHTML=viewLogin(); return; }
    $("#evname").textContent=EVNAME||"لوحة الاستقبال";
    var ts=document.querySelectorAll("[data-tab]");
    for(var i=0;i<ts.length;i++) ts[i].setAttribute("aria-pressed",String(ts[i].dataset.tab===S.tab));
    $("#view").innerHTML=VIEWS[S.tab]();
    if(S.tab==="badge"&&VISITORS.length){
      var v=null; for(var j=0;j<VISITORS.length;j++) if(VISITORS[j].code===S.badge) v=VISITORS[j];
      if(!v) v=VISITORS[0];
      qr($("#bq"),v.code,160);
    }
    if(S.tab==="gate"){ var gc=$("#gc"); if(gc) gc.focus(); }
  }

  function toast(sel,cls,msg){
    var el=$(sel); if(!el)return;
    el.innerHTML='<div class="note '+cls+'">'+msg+'</div>';
    setTimeout(function(){ if(el) el.innerHTML=""; },4000);
  }

  function loadVisitors(){
    return sb.from("visitors").select("*").order("created_at",{ascending:false}).limit(1000)
      .then(function(res){
        if(res.error){ VISITORS=[]; return; }
        VISITORS=res.data||[];
      });
  }

  function loadEvent(){
    return sb.rpc("event_info",{p_slug:EVENT_SLUG}).then(function(res){
      var d=(res&&res.data)||{}; if(d.ok) EVNAME=d.name_ar||"";
    },function(){});
  }

  /* ---------- events ---------- */
  document.addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b)return;

    if(b.dataset.tab){ S.tab=b.dataset.tab; S.gate=null; render(); return; }
    if(b.dataset.badge){ S.badge=b.dataset.badge; S.tab="badge"; render(); return; }
    if(b.id==="print"){ window.print(); return; }
    if(b.id==="logout"){ sb.auth.signOut().then(function(){ SESSION=null; VISITORS=[]; render(); }); return; }
    if(b.id==="refresh"){ b.disabled=true; loadVisitors().then(function(){ render(); }); return; }

    if(b.id==="csv"){
      if(!VISITORS.length) return;
      var L=["code,name,company,job_title,category,phone,email,source,registered_at,checked_in_at"];
      function c(x){ x=String(x==null?"":x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }
      VISITORS.forEach(function(v){ L.push([c(v.code),c(v.name),c(v.company),c(v.job_title),
        c(catName(v.category)),c("966"+v.phone),c(v.email),c(v.source),
        c(v.created_at),c(v.checked_in_at)].join(",")); });
      var blob=new Blob(["﻿"+L.join("\r\n")],{type:"text/csv;charset=utf-8"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="visitors.csv";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
      return;
    }

    if(b.id==="su"){
      var e=($("#le")||{}).value||"", p=($("#lp")||{}).value||"";
      if(!e||!p){ S.msg="اكتب البريد وكلمة المرور أولاً"; return render(); }
      b.disabled=true;
      sb.auth.signUp({email:e,password:p}).then(function(res){
        b.disabled=false;
        S.msg = res.error ? ("تعذّر الإنشاء: "+res.error.message)
              : "تم إنشاء الحساب. شغّل سطر إضافة الموظف في setup.sql ثم ادخل.";
        render();
      });
      return;
    }
  });

  document.addEventListener("change",function(ev){
    if(ev.target.id==="bpick"){ S.badge=ev.target.value; render(); }
  });

  document.addEventListener("input",function(ev){
    var t=ev.target;
    if(t.id==="sbx"){
      S.q=t.value; $("#view").innerHTML=viewList();
      var sb2=$("#sbx"); if(sb2){ sb2.value=S.q; sb2.focus();
        try{ sb2.setSelectionRange(S.q.length,S.q.length); }catch(e){} }
      return;
    }
    if(t.id==="gc"){ t.value=t.value.replace(/\D/g,"").slice(0,8); return; }
  });

  document.addEventListener("submit",function(ev){
    ev.preventDefault();

    if(ev.target.id==="lf"){
      var e=$("#le").value, p=$("#lp").value, lb=$("#lb");
      lb.disabled=true; lb.innerHTML='<span class="spin"></span> جارِ الدخول…';
      sb.auth.signInWithPassword({email:e,password:p}).then(function(res){
        if(res.error){ S.msg="بيانات الدخول غير صحيحة"; render(); return; }
        SESSION=res.data.session;
        Promise.all([loadEvent(),loadVisitors()]).then(function(){ S.msg=""; render(); });
      });
      return;
    }

    if(ev.target.id==="gf"){
      var code=($("#gc").value||"").replace(/\D/g,"");
      if(code.length!==8){ S.gate={kind:"no",title:"رمز غير مكتمل",mid:"الرمز ٨ أرقام"}; render(); return; }
      sb.rpc("do_checkin",{p_code:code}).then(function(res){
        var r=(res&&res.data)||{};
        if(res.error||r.error==="forbidden"){
          S.gate={kind:"no",title:"غير مصرّح",mid:"حسابك غير مضاف لجدول الموظفين"};
        } else if(r.ok){
          S.gate={kind:"ok",title:r.name,
            mid:(r.company?r.company+" · ":"")+"تم تسجيل الدخول "+hhmm(r.at),
            chip:catName(r.category),cls:catCls(r.category)};
        } else if(r.error==="already"){
          S.gate={kind:"dup",title:r.name,mid:"دخل مسبقاً الساعة "+hhmm(r.at),
            chip:catName(r.category),cls:catCls(r.category)};
        } else if(r.error==="unknown"){
          S.gate={kind:"no",title:"كود غير معروف",mid:"لا يوجد زائر بهذا الرمز: "+code};
        } else {
          S.gate={kind:"no",title:"تعذّر تسجيل الدخول",mid:""};
        }
        loadVisitors().then(function(){ render(); });
      });
      return;
    }

    if(ev.target.id==="qf"){
      var n=($("#qn").value||"").trim(), ph=digits($("#qp").value||"");
      if(n.length<2) return toast("#qmsg","d","اكتب الاسم الكامل");
      if(!/^5\d{8}$/.test(ph)) return toast("#qmsg","d","رقم الجوال غير صحيح");
      sb.rpc("quick_register",{p_event_slug:EVENT_SLUG,p_name:n,p_phone:ph}).then(function(res){
        var r=(res&&res.data)||{};
        if(res.error) return toast("#qmsg","d","تعذّر التسجيل");
        if(r.ok){
          $("#qn").value=""; $("#qp").value="";
          loadVisitors().then(function(){
            toast("#qmsg","g","تم التسجيل — الرمز <b>"+esc(r.code)+"</b>");
          });
        } else if(r.error==="duplicate"){
          toast("#qmsg","w","مسجّل مسبقاً — الرمز <b>"+esc(r.code)+"</b>");
        } else if(r.error==="forbidden"){
          toast("#qmsg","d","حسابك غير مضاف لجدول الموظفين");
        } else {
          toast("#qmsg","d","تعذّر التسجيل");
        }
      });
      return;
    }
  });

  /* ---------- boot ---------- */
  try{
    if(SUPABASE_URL.indexOf("XXXX")>=0) throw new Error("لم تُضبط إعدادات Supabase بعد");
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  }catch(e){
    $("#view").innerHTML='<div class="note d" style="margin-top:40px"><b>خطأ في الإعداد.</b><br>'+esc(e.message)+'</div>';
  }

  if(sb){
    sb.auth.getSession().then(function(res){
      SESSION=(res&&res.data&&res.data.session)||null;
      if(!SESSION){ render(); return; }
      Promise.all([loadEvent(),loadVisitors()]).then(function(){ render(); });
    });
    sb.auth.onAuthStateChange(function(_e,s){
      if(!s && SESSION){ SESSION=null; VISITORS=[]; render(); }
    });
  }
})();
</script>
</body>
</html>
